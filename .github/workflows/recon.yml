name: ReconQ ASM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Passive discovery or baseline initialization
        required: true
        default: recon
        type: choice
        options: [recon, baseline]
      baseline:
        description: Initialize state without sending alerts
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: reconq-asm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GO_VERSION: '1.24.2'
      RECON_MODE: ${{ github.event.inputs.mode || 'recon' }}
      BASELINE: ${{ github.event.inputs.baseline || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore state branch
        continue-on-error: true
        run: |
          git fetch origin state:refs/remotes/origin/state || true
          if git show-ref --verify --quiet refs/remotes/origin/state; then
            mkdir -p state
            git archive origin/state | tar -x -C state
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned passive tools
        run: |
          set -euo pipefail
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.8
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.10
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Restore optional Subfinder provider config
        env:
          SUBFINDER_CONFIG_B64: ${{ secrets.SUBFINDER_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.config/subfinder"
          if [ -n "$SUBFINDER_CONFIG_B64" ]; then
            printf '%s' "$SUBFINDER_CONFIG_B64" | base64 -d > "$HOME/.config/subfinder/provider-config.yaml"
            chmod 600 "$HOME/.config/subfinder/provider-config.yaml"
          fi

      - name: Validate explicit authorized scope
        run: |
          mkdir -p artifacts state
          python3 scripts/validate_scope.py scope/scope.txt artifacts/scope-roots.txt

      - name: Passive subdomain discovery
        run: |
          set -euo pipefail
          : > artifacts/subs.txt
          while IFS= read -r root; do
            [ -z "$root" ] && continue
            subfinder -d "$root" -silent -o "artifacts/subs-${root}.txt"
            cat "artifacts/subs-${root}.txt" >> artifacts/subs.txt
          done < artifacts/scope-roots.txt
          sort -fu artifacts/subs.txt -o artifacts/subs.txt
          python3 scripts/validate_scope.py artifacts/subs.txt artifacts/subs_scoped.txt
          mv artifacts/subs_scoped.txt artifacts/subs.txt

      - name: Resolve DNS candidates
        run: |
          set -euo pipefail
          if [ -s artifacts/subs.txt ]; then
            dnsx -l artifacts/subs.txt -silent -a -aaaa -resp-only -o artifacts/resolved.txt
            sort -fu artifacts/resolved.txt -o artifacts/resolved.txt
          else
            : > artifacts/resolved.txt
          fi
          python3 scripts/validate_scope.py artifacts/resolved.txt artifacts/resolved_scoped.txt
          mv artifacts/resolved_scoped.txt artifacts/resolved.txt

      - name: Compute asset delta and baseline
        id: asset-diff
        run: |
          set -euo pipefail
          touch state/subs_known.txt
          sort -fu state/subs_known.txt -o state/subs_known.txt
          sort -fu artifacts/resolved.txt -o artifacts/resolved.txt
          comm -13 state/subs_known.txt artifacts/resolved.txt > artifacts/subs_new.txt
          cat artifacts/resolved.txt state/subs_known.txt | sort -fu > state/subs_known.next
          mv state/subs_known.next state/subs_known.txt
          if [ "$BASELINE" = 'true' ] || [ "$RECON_MODE" = 'baseline' ]; then
            : > artifacts/subs_new.txt
            echo 'baseline=true' >> "$GITHUB_OUTPUT"
          else
            echo 'baseline=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe in-scope web services
        run: |
          set -euo pipefail
          if [ -s artifacts/resolved.txt ]; then
            httpx -l artifacts/resolved.txt -silent -json -status-code -title -tech-detect -no-color -o artifacts/httpx.jsonl
            jq -r 'select(.url != null) | .url' artifacts/httpx.jsonl | sort -u > artifacts/alive.txt
          else
            : > artifacts/httpx.jsonl
            : > artifacts/alive.txt
          fi

      - name: Build report
        run: |
          python3 scripts/build_summary.py
          tar -czf reconq-artifacts.tar.gz artifacts state

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reconq-${{ github.run_id }}
          path: |
            artifacts/
            reconq-artifacts.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Send Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASELINE: ${{ steps.asset-diff.outputs.baseline }}
        run: |
          set -euo pipefail
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || { echo 'Telegram secrets missing; skipping'; exit 0; }
          SUMMARY="$(cat artifacts/telegram-summary.txt 2>/dev/null || printf 'ReconQ run completed; see GitHub artifacts.')"
          [ "$BASELINE" != 'true' ] || SUMMARY='ReconQ baseline initialized; notifications suppressed.'
          jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$SUMMARY\n\nRun: $RUN_URL" '{chat_id:$chat,text:$text,disable_web_page_preview:true}' > payload.json
          curl --fail --silent --show-error --max-time 15 -H 'Content-Type: application/json' -d @payload.json "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" | jq -e '.ok == true' >/dev/null

      - name: Persist state to dedicated branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RECONQ_STATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo 'RECONQ_STATE_TOKEN missing; state remains only in artifact'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state || true
          git add state/subs_known.txt
          git commit -m 'chore(state): update ReconQ asset baseline' || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:state
